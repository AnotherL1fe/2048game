<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>2048</title>

    
  <script type="module" crossorigin src="./assets/index-5fc5a1f3.js"></script>
  <link rel="stylesheet" href="./assets/index-e801e90f.css">
</head>

<body>
    <div class="game-wrapper">
        <header class="game-header">
            <div class="logo-section">
                <h1 class="game-title">2048</h1>
                <p class="game-subtitle">Собери 2048!</p>
            </div>
            <div class="score-section">
                <div class="score-chip current-score">
                    <span class="score-icon">⭐</span>
                    <span class="score-label">Счет</span>
                    <span class="score-value currentScore">0</span>
                </div>
                <div class="score-chip max-score">
                    <span class="score-icon">🏆</span>
                    <span class="score-label">Рекорд</span>
                    <span class="score-value maxScore">0</span>
                </div>
            </div>
        </header>

        <div class="game-controls">
            <button class="btn btn-new-game">Новая игра</button>
        </div>

        <div class="game-field" id="gameField">
            <div class="game-back">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="game-tiles" id="gameTiles"></div>
            <div class="game-overlay" id="gameOverlay">
                <h2 id="overlayTitle">Игра окончена!</h2>
                <div class="final-score" id="finalScore">0</div>
                <div class="overlay-buttons">
                    <button class="btn btn-new-game" id="restartBtn">Новая игра</button>
                    <button class="btn btn-continue" id="continueBtn" style="display:none;">Продолжить</button>
                </div>
            </div>
        </div>

        <div class="game-stats">
            <span>Ходов: <span class="moves-count">0</span></span>
            <span>Время: <span class="time-count">00:00</span></span>
        </div>

        <div class="game-footer">
            <button class="btn theme-toggle" title="Переключить тему">🌙</button>
            <button class="btn sound-toggle" title="Звук">🔊</button>
        </div>
    </div>

    <div class="save-indicator" id="saveIndicator">Сохранено</div>
    <div class="mobile-hint">Проведи пальцем для хода</div>

    
</body>

</html>
